name: Sync articles to Flutter frontend

on:
  push:
    branches:
      - main
    paths:
      - 'content/article/**'
      - '.github/workflows/sync-articles.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hub repo
        uses: actions/checkout@v4
        with:
          path: hub

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: hub/package-lock.json

      - name: Install hub dependencies
        run: npm ci
        working-directory: hub

      - name: Generate articles_data.dart
        run: node scripts/generate-articles-dart.js
        working-directory: hub

      - name: Checkout Flutter frontend repo
        uses: actions/checkout@v4
        with:
          repository: andres-angulo-dev/sio2_renovations_frontend
          token: ${{ secrets.FRONTEND_PAT }}
          path: frontend

      - name: Copy generated articles_data.dart
        run: cp hub/generated/articles_data.dart frontend/lib/data/articles_data.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the project is developed with — an unpinned
          # 'stable' channel drifts over time and broke the build (Aug 2026).
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Create local.env
        run: |
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" > local.env
          echo "PARTNER_BACKEND_API_URL=${{ secrets.PARTNER_BACKEND_API_URL }}" >> local.env
          echo "CUSTOMER_BACKEND_API_URL=${{ secrets.CUSTOMER_BACKEND_API_URL }}" >> local.env
        working-directory: frontend

      - name: Build Flutter web
        # Single source of truth: the frontend's own build.sh (clean + build +
        # sitemap). Any step added there applies to CI automatically.
        run: bash build.sh
        working-directory: frontend

      - name: Commit and push build to frontend repo
        working-directory: frontend
        run: |
          LATEST_TITLE=$(cat ../hub/generated/latest_title.txt)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/data/articles_data.dart
          # Security: local.env (API key + backend URLs) must never be tracked —
          # see frontend commit 255ff97. The bare `find | git add -f` used to
          # re-add it; exclude it and untrack any copy left by earlier runs.
          git rm --cached --ignore-unmatch --quiet build/web/assets/local.env || true
          find build/web -type f ! -path 'build/web/assets/local.env' | xargs git add -f
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(articles): \"$LATEST_TITLE\" + web build"
          git push
